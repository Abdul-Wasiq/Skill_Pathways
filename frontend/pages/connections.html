<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Connections — CareerBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>
  <div class="container">
    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>

    <div class="card">
      <h3 class="mt-0">Pending Requests</h3>
      <div id="pendingList" class="text-muted">Loading...</div>
    </div>

    <div class="card">
      <h3 class="mt-0">Your Connections</h3>
      <div id="connectionsList" class="text-muted">Loading...</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requireLogin();
    renderNavbar("connections.html");

    async function loadConnections() {
      hideError("errorBox");
      try {
        const pending = await apiRequest("/api/connections/pending");
        document.getElementById("pendingList").innerHTML = pending.length
          ? pending.map(p => `
              <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
                <div><strong>${p.requester_name}</strong> <span class="text-muted">(${p.requester_role})</span></div>
                <div>
                  <button data-id="${p.id}" class="acceptBtn" style="margin-top:0;">Accept</button>
                  <button data-id="${p.id}" class="secondary rejectBtn" style="margin-top:0;">Reject</button>
                </div>
              </div>
            `).join("")
          : `<p class="text-muted">No pending requests.</p>`;

        const connections = await apiRequest("/api/connections");
        document.getElementById("connectionsList").innerHTML = connections.length
          ? connections.map(c => `
              <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
                <div><strong>${c.other_user_name}</strong> <span class="text-muted">(${c.other_user_role})</span></div>
                <button data-id="${c.id}" class="secondary danger removeBtn" style="margin-top:0;">Remove</button>
              </div>
            `).join("")
          : `<p class="text-muted">No connections yet. Search for people to connect with.</p>`;

        document.querySelectorAll(".acceptBtn").forEach(el =>
          el.addEventListener("click", async () => {
            await apiRequest(`/api/connections/${el.dataset.id}/accept`, { method: "PUT" });
            showSuccess("successBox", "Connection accepted.");
            loadConnections();
          })
        );
        document.querySelectorAll(".rejectBtn").forEach(el =>
          el.addEventListener("click", async () => {
            await apiRequest(`/api/connections/${el.dataset.id}/reject`, { method: "PUT" });
            loadConnections();
          })
        );
        document.querySelectorAll(".removeBtn").forEach(el =>
          el.addEventListener("click", async () => {
            await apiRequest(`/api/connections/${el.dataset.id}`, { method: "DELETE" });
            loadConnections();
          })
        );
      } catch (err) {
        showError("errorBox", err.message);
      }
    }

    loadConnections();
  </script>
</body>
</html>
