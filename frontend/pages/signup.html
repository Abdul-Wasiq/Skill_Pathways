<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign Up — CareerBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container" style="max-width: 460px; margin-top: 40px;">
    <div class="card">
      <h2 class="mt-0">Create your account</h2>
      <div id="errorBox" class="error-msg"></div>
      <form id="signupForm">
        <label for="name">Full name</label>
        <input type="text" id="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" />
        <small class="text-muted">At least 8 characters, with letters and numbers.</small>

        <label for="role">I am a...</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="professional">Job Seeker / Professional</option>
          <option value="organization">Organization</option>
        </select>

        <button type="submit" id="submitBtn">Create Account</button>
      </form>
      <p class="text-muted" style="margin-top:16px;">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError("errorBox");
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        const data = await apiRequest("/api/auth/register", {
          method: "POST",
          auth: false,
          body: {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            role: document.getElementById("role").value,
          },
        });
        Auth.setSession(data.access_token, data.user);
        window.location.href = "home.html";
      } catch (err) {
        showError("errorBox", err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
